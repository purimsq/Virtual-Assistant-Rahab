<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>

  <!-- Central Connected Hub (AI/Brain) -->
  <g transform="translate(400, 300)">
    <!-- Circuit Connections -->
    <path d="M0 -80 L0 -160 M0 80 L0 160 M-80 0 L-160 0 M80 0 L160 0 M-60 -60 L-120 -120 M60 -60 L120 -120 M-60 60 L-120 120 M60 60 L120 120" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Central Node -->
    <circle r="80" fill="url(#aiGradient)" filter="url(#glow)"/>
    <path d="M-40 0 L-20 -20 L0 0 L20 -20 L40 0" stroke="white" stroke-width="4" fill="none" opacity="0.8"/>
    <circle cx="0" cy="30" r="5" fill="white" opacity="0.8"/>
    <circle cx="-30" cy="30" r="5" fill="white" opacity="0.8"/>
    <circle cx="30" cy="30" r="5" fill="white" opacity="0.8"/>
  </g>

  <!-- Surrounding Elements -->
  <!-- Productivity (Graph/Chart) -->
  <g transform="translate(600, 150)">
    <circle r="60" fill="white" filter="url(#glow)"/>
    <path d="M-30 20 L-10 0 L10 10 L30 -20" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="30" cy="-20" r="4" fill="#10b981"/>
  </g>

  <!-- Collaboration (People Nodes) -->
  <g transform="translate(200, 150)">
    <circle r="60" fill="white" filter="url(#glow)"/>
    <circle cx="-20" cy="10" r="10" fill="#f59e0b"/>
    <circle cx="20" cy="10" r="10" fill="#f59e0b"/>
    <circle cx="0" cy="-20" r="10" fill="#f59e0b"/>
    <path d="M-20 10 L0 -20 L20 10 L-20 10" stroke="#f59e0b" stroke-width="2" fill="none"/>
  </g>

  <!-- Well-being (Heart/Organic) -->
  <g transform="translate(200, 450)">
    <circle r="60" fill="white" filter="url(#glow)"/>
    <path d="M0 10 C-20 -10 -40 -10 -40 10 C-40 30 -10 50 0 60 C10 50 40 30 40 10 C40 -10 20 -10 0 10" transform="translate(0, -25) scale(0.8)" fill="#ef4444"/>
  </g>

  <!-- Security/Ethics (Shield) -->
  <g transform="translate(600, 450)">
    <circle r="60" fill="white" filter="url(#glow)"/>
    <path d="M-20 -20 L20 -20 L20 0 C20 20 0 35 -20 0 Z" transform="translate(0, 10)" fill="none" stroke="#6366f1" stroke-width="3"/>
    <path d="M0 -15 L0 15 M-15 0 L15 0" stroke="#6366f1" stroke-width="3"/>
  </g>

</svg>
