<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#grad)" />
  
  <!-- Abstract Document Icon -->
  <g transform="translate(250, 120)">
    <rect x="0" y="0" width="100" height="130" rx="8" fill="white" stroke="#94a3b8" stroke-width="2"/>
    <line x1="20" y1="30" x2="80" y2="30" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="50" x2="80" y2="50" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="70" x2="80" y2="70" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="90" x2="60" y2="90" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Abstract Email Icon -->
  <g transform="translate(220, 180)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="2"/>
    <path d="M0 0 L80 60 L160 0" fill="none" stroke="#3b82f6" stroke-width="2"/>
  </g>
  
  <!-- Text -->
  <text x="300" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#475569" text-anchor="middle">Executive Communication</text>
  <text x="300" y="370" font-family="Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">& Project Coordination</text>
</svg>
